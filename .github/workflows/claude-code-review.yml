name: Claude Code Review

# Explicit, owner-authorized dispatch only. Avoid model calls for every push to a PR.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: number

concurrency:
  group: claude-code-review-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    if: github.actor == 'frankxai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ inputs.pr_number }} in this repository. Check code quality, defects,
            performance, security and test coverage. Read CLAUDE.md and relevant changed files.
            Provide a concise review as a PR comment, including specific evidence for any finding.
            Do not implement changes, trigger other workflows, or initiate unrelated missions.
          claude_args: '--max-turns 5 --allowed-tools "Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
