name: Claude Code

# Disable mention-triggered model execution until an admission controller with
# per-provider budgets and authorized identities is in place.
on:
  workflow_dispatch:
    inputs:
      mission:
        description: 'Bounded, operator-approved Claude task'
        required: true
        type: string

concurrency:
  group: claude-code-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  claude:
    if: github.actor == 'frankxai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Run bounded Claude Code mission
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Execute only this operator-approved, bounded mission:
            ${{ inputs.mission }}
            Read-only analysis and recommendations. Do not mutate repository files,
            deploy, create follow-up workflows or invoke external metered services.
          claude_args: '--max-turns 5 --allowed-tools "Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'
